<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar Sound</title>
  <meta name="description" content="Ascolta il vento solare in tempo reale, dai dati NOAA SWPC.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='30' fill='%23f5a623'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <header class="hero">
      <div class="sun" aria-hidden="true"></div>
      <div>
        <h1>Solar Sound</h1>
        <p class="lede">Il vento solare misurato al punto L1, a 1,5 milioni di km dalla Terra, trasformato in suono.
          La velocità decide l’altezza della nota, la densità il volume, la temperatura il timbro.</p>
      </div>
    </header>

    <button id="listen" type="button" aria-pressed="false">Ascolta il Sole</button>

    <div id="sources"></div>

    <footer>
      Dati: <a href="https://www.swpc.noaa.gov/products/real-time-solar-wind" target="_blank" rel="noopener">NOAA SWPC Real-Time Solar Wind</a>,
      aggiornati ogni minuto.
    </footer>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
